name: Проверка контента

# Сайт публикует Cloudflare Pages (подключён к репозиторию, сборка не нужна).
# Этот workflow только проверяет контент, чтобы ошибка в JSON не попала на сайт незамеченной.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверка контента
        run: node scripts/validate.mjs
